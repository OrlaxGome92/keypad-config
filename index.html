<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Keypad Web Center</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Test Zone Styling */
        .test-section {
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
            background: #252525;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        #test-input {
            width: 100%;
            background: #111;
            border: 2px solid #555;
            color: var(--primary);
            font-family: monospace;
            font-size: 1.2rem;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            outline: none;
        }
        #test-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0,210,255,0.2);
        }
        /* Summary Table Styling */
        .summary-section { margin-top: 40px; width: 100%; max-width: 800px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: var(--primary); font-size: 0.9rem; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Layers</h3>
        <div class="layer-item active">Base Layer</div>
    </div>

    <div class="workspace">
        <header>
            <h1>Smart Keypad Center</h1>
            <div id="status-bar">
                <button id="connectBtn">Connect Keypad</button>
                <span id="status">Status: Disconnected</span>
            </div>
        </header>
        
        <div class="main-interface">
            <div class="keypad-visual">
                <div class="key knob" id="v-6" data-idx="6">Knob</div>
                <div class="key" id="v-0" data-idx="0">K1</div>
                <div class="key" id="v-1" data-idx="1">K2</div>
                <div class="key" id="v-2" data-idx="2">K3</div>
                <div class="key" id="v-3" data-idx="3">K4</div>
                <div class="key" id="v-4" data-idx="4">K5</div>
                <div class="key" id="v-5" data-idx="5">K6</div>
            </div>

            <div id="editor-container" class="hidden">
                <h3 id="editingLabel">Editing Key</h3>
                
                <div class="control-group">
                    <label>1. Assign Function Key:</label>
                    <select id="fkey-selector"></select>
                </div>

                <div class="control-group">
                    <label>2. Binding Name (Optional):</label>
                    <input type="text" id="bind-name" placeholder="e.g. Mic Mute">
                </div>

                <div class="control-group">
                    <label>3. Description (Optional):</label>
                    <textarea id="bind-desc" rows="2" placeholder="Description..."></textarea>
                </div>

                <button id="save-binding-btn">💾 Save Configuration</button>
                <button id="clear-binding-btn" style="background: #444; margin-top: 10px;">❌ Clear Key</button>
            </div>
        </div>

        <div class="test-section">
            <h3>🧪 Test Your Keypad</h3>
            <p style="color:#aaa; font-size: 0.9rem; margin-bottom: 10px;">Click in the box below and press your physical keypad button to verify the output.</p>
            <input type="text" id="test-input" placeholder="Click here & press keypad button..." autocomplete="off">
            <div id="test-output" style="text-align: center; color: #888; margin-top: 5px; font-size: 0.8rem;">Waiting for input...</div>
        </div>

        <div class="summary-section">
            <h3>Configuration Summary</h3>
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Pad Key</th>
                        <th>Name</th>
                        <th>Output</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="summary-body">
                    <tr><td colspan="4" style="text-align:center; color:#666;">No keys programmed yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
