<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Keypad Configurator</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .hidden { display: none !important; }
        .success-msg { color: #00ff00; font-size: 0.9rem; margin-top: 5px; opacity: 0; transition: opacity 0.5s; }
        .show-success { opacity: 1; }
        
        /* Summary Table Styling */
        .summary-section { margin-top: 40px; width: 100%; max-width: 600px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: var(--primary); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Layers</h3>
        <div class="layer-item active">Base Layer</div>
    </div>

    <div class="workspace">
        <header>
            <h1>Keypad Configurator</h1>
            <div id="status-bar">
                <button id="connectBtn">Connect Keypad</button>
                <span id="status">Status: Disconnected</span>
            </div>
        </header>
        
        <div class="main-interface">
            <div class="keypad-visual">
                <div class="key knob" id="v-6" data-idx="6">Knob</div>
                <div class="key" id="v-0" data-idx="0">K1</div>
                <div class="key" id="v-1" data-idx="1">K2</div>
                <div class="key" id="v-2" data-idx="2">K3</div>
                <div class="key" id="v-3" data-idx="3">K4</div>
                <div class="key" id="v-4" data-idx="4">K5</div>
                <div class="key" id="v-5" data-idx="5">K6</div>
            </div>

            <div id="editor-container" class="hidden">
                <h3 id="editingLabel">Editing Key</h3>
                
                <div class="control-group">
                    <label>Assign Function Key:</label>
                    <select id="fkey-selector"></select>
                </div>

                <div style="margin-top: 20px;">
                    <button id="save-binding-btn">💾 Save to Device</button>
                    <div id="save-msg" class="success-msg">Saved Successfully!</div>
                </div>
            </div>
        </div>

        <div class="summary-section">
            <h3>Current Configuration</h3>
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Pad Key</th>
                        <th>Assigned Function</th>
                    </tr>
                </thead>
                <tbody id="summary-body">
                    <tr><td colspan="2" style="text-align:center; color:#666;">No keys programmed yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
