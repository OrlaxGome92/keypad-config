<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Keypad Web Center</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="sidebar" id="layerList">
        <h3>Layers</h3>
        <div id="layersContainer">
            <div class="layer-item active">Base Layer</div>
        </div>
        <button id="addLayerBtn">+ Add Layer</button>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <button id="folderBtn">📁 Select Media Folder</button>
    </div>

    <div class="workspace">
        <header>
            <h1>Smart Keypad Center</h1>
            <div id="status-bar">
                <button id="connectBtn">Connect Keypad</button>
                <span id="status">Status: Disconnected</span>
            </div>
        </header>
        
        <div class="main-interface">
            <div class="keypad-visual">
                <div class="key knob" id="v-6" data-idx="6">Knob</div>
                <div class="key" id="v-0" data-idx="0">K1</div>
                <div class="key" id="v-1" data-idx="1">K2</div>
                <div class="key" id="v-2" data-idx="2">K3</div>
                <div class="key" id="v-3" data-idx="3">K4</div>
                <div class="key" id="v-4" data-idx="4">K5</div>
                <div class="key" id="v-5" data-idx="5">K6</div>
            </div>

            <div id="editor-container" class="hidden">
                <div id="action-menu">
                    <h3 id="editingLabel">Key 1</h3>
                    <button id="btn-new">➕ New</button>
                    <button id="btn-edit">✏️ Edit</button>
                    <button id="btn-delete" class="danger">🗑️ Delete</button>
                </div>

                <div id="binding-form" class="hidden">
                    <div class="control-group">
                        <label>Binding Name:</label>
                        <input type="text" id="bind-name" placeholder="e.g. Copy Tool">
                    </div>
                    <div class="control-group">
                        <label>Shortcut (Press keys to record):</label>
                        <div id="shortcut-recorder">Click 'New' to record</div>
                    </div>
                    <div class="control-group">
                        <label>Description:</label>
                        <textarea id="bind-desc" rows="3" placeholder="What does this key do?"></textarea>
                    </div>
                    <button id="save-binding-btn">💾 Save to Keypad</button>
                </div>
            </div>
        </div>

        <div class="test-bench">
            <h3>Live Key Test</h3>
            <div id="testDisplay">Connect device and press keys to test...</div>
        </div>

        <div class="media-preview" id="player">
            <img src="" id="slide" class="hidden">
            <p id="mediaStatus">Media Player Idle</p>
        </div>
    </div>

    <script type="module">
        import { 
            connectDevice, 
            saveActiveBinding, 
            startNewBinding, 
            handleKeySelection,
            deleteBinding 
        } from './main.js';

        // Interface Listeners
        document.getElementById('connectBtn').onclick = connectDevice;
        document.getElementById('btn-new').onclick = startNewBinding;
        document.getElementById('save-binding-btn').onclick = saveActiveBinding;
        document.getElementById('btn-delete').onclick = deleteBinding;

        // Visual Key Selection
        document.querySelectorAll('.key').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.idx);
                handleKeySelection(idx);
            });
        });

        // Global Keyboard Listener for Recorder
        window.addEventListener('keydown', (e) => {
            // This is handled inside main.js via an exported function
            // or by checking a global state.
        });
    </script>
</body>
</html>
