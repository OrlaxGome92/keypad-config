<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Keypad Web Center</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Embedded specific overrides can go here, 
           but most styles should remain in style.css */
        
        /* Summary Table Styling */
        .summary-section { margin-top: 40px; width: 100%; max-width: 800px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: var(--primary); font-size: 0.9rem; }
        
        /* Modal Styling */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e; padding: 40px; border-radius: 15px; border: 2px solid var(--primary);
            text-align: center; width: 450px; box-shadow: 0 0 30px rgba(0,210,255,0.3);
        }
        #modal-recorder-display {
            background: #000; color: var(--primary); padding: 30px; margin: 20px 0;
            font-family: 'Consolas', monospace; font-size: 2rem; border-radius: 8px; border: 1px dashed #444;
        }
        .modal-actions { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn-danger { background: #ff4444 !important; color: white !important; }
        .btn-secondary { background: #444 !important; color: white !important; }
    </style>
</head>
<body>
    <div class="sidebar" id="layerList">
        <h3>Layers</h3>
        <div id="layersContainer">
            <div class="layer-item active">Base Layer</div>
        </div>
        <button id="addLayerBtn" style="opacity: 0.5; cursor: not-allowed;">+ Add Layer</button>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <button id="folderBtn">📁 Select Media Folder</button>
    </div>

    <div class="workspace">
        <header>
            <h1>Smart Keypad Center</h1>
            <div id="status-bar">
                <button id="connectBtn">Connect Keypad</button>
                <span id="status">Status: Disconnected</span>
            </div>
        </header>
        
        <div class="main-interface">
            <div class="keypad-visual">
                <div class="key knob" id="v-6" data-idx="6">Knob</div>
                <div class="key" id="v-0" data-idx="0">K1</div>
                <div class="key" id="v-1" data-idx="1">K2</div>
                <div class="key" id="v-2" data-idx="2">K3</div>
                <div class="key" id="v-3" data-idx="3">K4</div>
                <div class="key" id="v-4" data-idx="4">K5</div>
                <div class="key" id="v-5" data-idx="5">K6</div>
            </div>

            <div id="editor-container" class="hidden">
                <h3 id="editingLabel">Editing Key</h3>
                
                <div class="control-group">
                    <label>1. Hardware Trigger (Internal F-Key):</label>
                    <select id="fkey-selector">
                        </select>
                </div>

                <div class="control-group">
                    <label>2. Shortcut Command:</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button id="btn-record-popup" style="background: #333; border: 1px solid var(--primary); color: var(--primary); flex: 1;">
                            ⏺ Record Key Combo
                        </button>
                        <div id="active-shortcut-display" style="flex: 1; font-weight: bold; color: var(--primary); padding: 10px; background: #000; border-radius: 4px; text-align: center; border: 1px solid #444;">
                            None
                        </div>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

                <div class="control-group">
                    <label>3. Binding Name:</label>
                    <input type="text" id="bind-name" placeholder="e.g. Photoshop Copy">
                </div>

                <div class="control-group">
                    <label>4. Description:</label>
                    <textarea id="bind-desc" rows="2" placeholder="What does this do?"></textarea>
                </div>

                <button id="save-binding-btn">💾 Save Configuration</button>
            </div>
        </div>

        <div class="summary-section">
            <h3>Configuration Summary</h3>
            <table>
                <thead>
                    <tr>
                        <th>Pad Key</th>
                        <th>Hardware ID</th>
                        <th>Name</th>
                        <th>Combo</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="summary-body">
                    <tr><td colspan="5" style="text-align:center; color:#666;">No keys programmed yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="record-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Recording Shortcut</h2>
            <p>Perform the key combination on your keyboard now.</p>
            <div id="modal-recorder-display">Listening...</div>
            <div class="modal-actions">
                <button id="modal-save">✅ Confirm & Save</button>
                <button id="modal-reset" class="btn-danger">↺ Reset</button>
                <button id="modal-cancel" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
